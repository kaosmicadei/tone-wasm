<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tone Generator</title>
</head>

<body>
  <button id="play">Play Tone</button>
  <script type="module">
    const wasm = await WebAssembly.instantiateStreaming(fetch('./tone.wasm'), { Math });
    const { instance } = wasm;
    const pulse = instance.exports;

    const ctx = new AudioContext();
    
    const sampleRate = ctx.sampleRate;
    const seconds = 2;
    const frameCount = sampleRate * seconds;
    
    // Create an audio buffer with 1 channel (mono)
    const buffer = ctx.createBuffer(1, frameCount, sampleRate);
    const data = buffer.getChannelData(0);
    
    pulse.set_sample_rate(sampleRate);
    pulse.set_pluse_duration(seconds);

    // Fill the buffer with the generated waveform
    for (let i = 0; i < frameCount; i++) {
        let amp = 0.5;
        data[i] = amp * pulse.envelope(5, 5, i) * pulse.sine_wave(440, i);
    }

    // Wire a source node to the buffer, connect to speakers, play.
    function playTone() {
        const source = ctx.createBufferSource();
        source.buffer = buffer;
        source.connect(ctx.destination);
        source.start();
    }

    document.getElementById('play').addEventListener('click', () => {
        if (ctx.state === 'suspended') ctx.resume();
        playTone();
    });
  </script>
</body>

</html>
